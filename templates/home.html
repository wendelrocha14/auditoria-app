<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Auditoria</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <!-- Cor do app -->
    <meta name="theme-color" content="#d60000">

    <!-- iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Auditoria">

    <!-- Ícone iPhone -->
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='imagens/icon-192.png') }}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 350px;
            padding: 30px 20px;
            border-radius: 20px;
            background: linear-gradient(to bottom, #ff4d4d, #ffb3b3, #ffffff);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: aparecer 0.4s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .upload-section {
            margin-top: 10px;
        }

        input[type="file"] {
            display: none; /* Esconde o botão feio do navegador */
        }

        .custom-file-upload {
            display: inline-block;
            padding: 12px;
            cursor: pointer;
            background: #fff;
            color: #d60000;
            border: 2px dashed #d60000;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 90%;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background: #d60000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #b80000; }
        button:active { transform: scale(0.97); }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <img src="{{ url_for('static', filename='imagens/img.png') }}" class="logo">
        <h2>Auditoria Ramarim</h2>
        
        <p class="info-text">Selecione o relatório PDF gerado hoje:</p>

        <!-- FORMULÁRIO DE UPLOAD -->
        <form action="/" method="post" enctype="multipart/form-data">
            <label class="custom-file-upload">
                <input type="file" name="relatorio" accept=".pdf" required onchange="displayFileName(this)">
                <span id="file-name">📎 Escolher PDF</span>
            </label>

            <button type="submit">
                Carregar e Iniciar
            </button>
        </form>
    </div>
</div>

<script>
// Função para mostrar o nome do arquivo selecionado
function displayFileName(input) {
    const fileName = input.files[0].name;
    document.getElementById('file-name').textContent = "✅ " + fileName;
}

// PWA Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}")
    .then(() => console.log('Service Worker registrado.'))
    .catch((error) => console.log('Erro no Service Worker:', error));
}
</script>

</body>
</html>
